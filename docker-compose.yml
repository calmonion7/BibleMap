# 작업 폴더에서 `docker compose up`을 해도 prod(`biblemap`)를 덮지 않게 이름을 따로 둔다.
# 배포(taebro-infra bin/deploy)는 -p biblemap / biblemap-dev 로 이 이름을 덮어쓴다.
# 변수에 `:?` 필수 표시를 두지 않는다 — bin/deploy 의 빌드는 .env 없는 러너 체크아웃에서 compose 를 읽는다.
# 값이 틀리면 /health 가 neo4j 503 으로 잡는다.
name: biblemap-local

services:
  neo4j:
    image: neo4j:5
    ports:
      # 호스트 스크립트(주입·연대 검증·저작 로더)가 쓰는 포트 — 실행 자리 .env 에서 prod 7687/7474, dev 7688/7475
      - "127.0.0.1:${NEO4J_BOLT_PORT}:7687"
      - "127.0.0.1:${NEO4J_HTTP_PORT}:7474"
    volumes:
      - neo4j_data:/data
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      # JVM 크기를 고정한다(기본값은 VM 전체 메모리 기준으로 잡힌다). 상한 768m 은 계약 v10 의 neo4j 예외 —
      # 쓰는 양은 이 설정이 정하므로 ×2 를 적용하지 않고, 512m 에서 스왑하던 것(7일 최대 상주 ~509 + 스왑 ~68MiB)에 여유를 준다.
      - NEO4J_server_memory_heap_initial__size=192m
      - NEO4J_server_memory_heap_max__size=192m
      - NEO4J_server_memory_pagecache_size=32m
    mem_limit: 768m
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
    depends_on:
      - neo4j
    # 상한 (taebro-infra 계약 v10 4절, 2026-10-16 `mem-report --summary` 7일 상주+스왑 최대×2): prod 227m · dev 270m(dev 실행 자리 .env 의 API_MEM). 키가 없으면 prod 값.
    mem_limit: ${API_MEM:-227m}
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "127.0.0.1:${TAEBRO_HTTP_PORT}:80"
    depends_on:
      - api
    mem_limit: 64m
    restart: unless-stopped

volumes:
  neo4j_data:
