# 작업 폴더에서 `docker compose up`을 해도 prod(`biblemap`)를 덮지 않게 이름을 따로 둔다.
# 배포(taebro-infra bin/deploy)는 -p biblemap / biblemap-dev 로 이 이름을 덮어쓴다.
name: biblemap-local

services:
  neo4j:
    image: neo4j:5
    ports:
      # 호스트 스크립트(주입·연대 검증·저작 로더)가 쓰는 포트 — 실행 자리 .env 에서 prod 7687/7474, dev 7688/7475
      - "127.0.0.1:${NEO4J_BOLT_PORT:?NEO4J_BOLT_PORT must be set}:7687"
      - "127.0.0.1:${NEO4J_HTTP_PORT:?NEO4J_HTTP_PORT must be set}:7474"
    volumes:
      - neo4j_data:/data
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set}
      # mem_limit 512m 안에 들게 JVM 크기를 고정한다(기본값은 VM 전체 메모리 기준으로 잡힌다)
      - NEO4J_server_memory_heap_initial__size=192m
      - NEO4J_server_memory_heap_max__size=192m
      - NEO4J_server_memory_pagecache_size=32m
    mem_limit: 512m
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set}
    depends_on:
      - neo4j
    # mem-report 는 상주(anon)만 세어 20MB로 보이지만 prod 실측 memory.peak 96MB(스왑 44MB 포함) → ×2
    mem_limit: 192m
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "127.0.0.1:${TAEBRO_HTTP_PORT}:80"
    depends_on:
      - api
    mem_limit: 64m
    restart: unless-stopped

volumes:
  neo4j_data:
