<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Outer gold ring -->
  <circle cx="50" cy="50" r="49" fill="#c9a84c"/>
  <!-- Navy background -->
  <circle cx="50" cy="50" r="43" fill="#1c2b50"/>
  <!-- Inner thin gold ring -->
  <circle cx="50" cy="50" r="37" fill="none" stroke="#c9a84c" stroke-width="1.5"/>
  <!-- Compass letters -->
  <text x="50" y="23" text-anchor="middle" dominant-baseline="middle" fill="#c9a84c" font-family="Georgia,serif" font-size="10" font-weight="bold">N</text>
  <text x="50" y="79" text-anchor="middle" dominant-baseline="middle" fill="#c9a84c" font-family="Georgia,serif" font-size="10" font-weight="bold">S</text>
  <text x="79" y="52" text-anchor="middle" dominant-baseline="middle" fill="#c9a84c" font-family="Georgia,serif" font-size="10" font-weight="bold">E</text>
  <text x="21" y="52" text-anchor="middle" dominant-baseline="middle" fill="#c9a84c" font-family="Georgia,serif" font-size="10" font-weight="bold">W</text>
  <!-- Cross (vertical bar) -->
  <rect x="46" y="29" width="8" height="44" rx="0.5" fill="#c9a84c"/>
  <!-- Cross (horizontal bar) -->
  <rect x="33" y="43" width="34" height="8" rx="0.5" fill="#c9a84c"/>
</svg>
