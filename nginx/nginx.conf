events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    gzip              on;
    gzip_types        text/css text/plain text/xml application/javascript application/json
                      application/geo+json image/svg+xml application/xml;
    gzip_min_length   1024;
    gzip_proxied      any;   # 이게 없으면 /api/* 프록시 응답이 통째로 빠진다
    gzip_vary         on;
    # eco: 레벨 5 — 사전압축(gzip_static)이 없어 요청마다 재압축하므로, 1 MB짜리 maplibre를
    # 매번 최고레벨로 미는 CPU 비용을 피한다. 5에서 이미 감축의 대부분을 얻는다.
    gzip_comp_level   5;

    server {
        listen 80;
        server_name _;

        location /api/ {
            proxy_pass         http://api:8000/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location = /index.html {
            root       /usr/share/nginx/html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            root       /usr/share/nginx/html;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            root       /usr/share/nginx/html;
            try_files  $uri /index.html;
        }
    }
}
