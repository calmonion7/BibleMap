<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>장면 승인</title>
<style>
  /* 폰 우선 · 세로 한 줄 · 가로 스크롤 없음. 간격은 4/8 한 스케일, 글자 크기는 3단. */
  :root{
    --s1:4px; --s2:8px; --s3:16px; --s4:24px;
    --t-s:13px; --t-b:15px; --t-l:19px;
    --bg:#faf8f4; --card:#fff; --ink:#1e1b16; --mut:#635c51; --line:#e3ded4;
    --ok:#1f5c3d; --ok-bg:#e6f1ea; --warn:#8a4413; --warn-bg:#fbeee2; --idle-bg:#eeeae2;
    --tap:44px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:var(--t-b)/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
       padding:var(--s3) var(--s3) 96px;max-width:720px;margin-inline:auto;overflow-x:hidden}
  h1{font-size:var(--t-l);margin:0 0 var(--s3)}
  h2{font-size:var(--t-b);font-weight:700;margin:0 0 var(--s2)}
  a{color:var(--ok)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:var(--s3);margin-bottom:var(--s3)}
  .row{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap}
  .mut{color:var(--mut);font-size:var(--t-s)}
  .wrap{overflow-wrap:anywhere}                      /* 긴 문구·부정어가 폭을 밀지 않게 */
  button{min-height:var(--tap);padding:0 var(--s3);border:1px solid var(--line);border-radius:8px;
         background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
  button.p{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600}
  button:disabled{opacity:.45;cursor:default}
  button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
  input,textarea{width:100%;min-height:var(--tap);padding:var(--s2);border:1px solid var(--line);
                 border-radius:8px;font:inherit;background:var(--card);color:var(--ink)}
  textarea{min-height:88px;resize:vertical}
  label{display:block;font-size:var(--t-s);color:var(--mut);margin:var(--s3) 0 var(--s1)}
  .chip{display:inline-flex;align-items:center;min-height:var(--tap);padding:0 var(--s3);border-radius:999px;
        border:1px solid var(--line);background:var(--idle-bg);font-size:var(--t-s);font-weight:600;cursor:pointer}
  .chip[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:1px}
  .s-승인{background:var(--ok-bg);color:var(--ok)}
  .s-재검토{background:var(--warn-bg);color:var(--warn)}
  .badge{display:inline-block;padding:2px var(--s2);border-radius:999px;font-size:var(--t-s);font-weight:700;
         background:var(--warn-bg);color:var(--warn)}
  .badge.ok{background:var(--ok-bg);color:var(--ok)}
  img.shot{width:100%;max-width:100%;border:1px solid var(--line);border-radius:8px;display:block;background:#fff}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s2)}
  .queue{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:#f6f2ea;padding:var(--s2) var(--s3);
         font-size:var(--t-s);max-height:38vh;overflow:auto}
  .queue pre{margin:var(--s1) 0 0;white-space:pre-wrap;overflow-wrap:anywhere;color:#d8d1c4}
  .queue .row{gap:var(--s2)}
  .queue button{min-height:36px;padding:0 var(--s3);border:1px solid #6b6459;border-radius:8px;
                background:transparent;color:#f6f2ea;font:inherit;font-size:var(--t-s)}
  .queue button:disabled{opacity:.4}
  .err{border-color:var(--warn);background:var(--warn-bg);color:var(--warn)}
  .ko{margin-top:var(--s1);padding:var(--s2);border-radius:8px;background:var(--idle-bg);
      color:var(--ink);font-size:var(--t-s);line-height:1.6;overflow-wrap:anywhere}
  .ko:empty{display:none}
  .ko .sep{color:var(--mut)}
  .ko .unk{color:var(--warn);font-weight:600}
  /* 구역 고르개 — 손가락으로 끌어 상자를 그린다. touch-action:none 이라야 끌 때 화면이 안 밀린다. */
  .pick{position:relative;width:100%;border:1px solid var(--line);border-radius:8px;overflow:hidden;
        background:#f7f0e2;touch-action:none;cursor:crosshair;user-select:none;-webkit-user-select:none}
  .pick img{display:block;width:100%;height:auto;pointer-events:none}
  .pick .blank{width:100%;height:100%}
  .pick .box{position:absolute;border:2px solid var(--ok);background:rgba(31,92,61,.16);
             box-shadow:0 0 0 9999px rgba(30,27,22,.28);pointer-events:none}
  .pick .hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;
              background:rgba(30,27,22,.72);color:#f6f2ea;font-size:var(--t-s);padding:var(--s1) var(--s2);
              border-radius:6px}
  ul{padding-left:1.1em;margin:var(--s1) 0}
</style>

<h1 id="head">장면 승인</h1>
<div id="app" aria-live="polite">불러오는 중…</div>
<div class="queue" id="q"></div>

<script>
/* 토큰: 처음 열 때 ?t=... 로 받아 저장한다. 그 뒤로는 주소에 없어도 된다.
   fetch는 헤더로 보내지만 <img src>는 헤더를 못 실으므로 이미지 주소엔 ?t=를 붙인다. */
const TK = (() => {
  const q = new URLSearchParams(location.search).get('t');
  try { if (q) localStorage.setItem('sceneToken', q); return q || localStorage.getItem('sceneToken') || ''; }
  catch (e) { return q || ''; }
})();
if (new URLSearchParams(location.search).get('t')) history.replaceState({}, '', location.pathname);
const img = (rel) => `/img/${encodeURI(rel)}` + (TK ? `?t=${encodeURIComponent(TK)}` : '');
const $ = (h) => { const d = document.createElement('div'); d.innerHTML = h; return d; };
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S = { scene: null, stage: null, tokens: null, busy: false };
let G = null;   // 한글 용어집 — 한 번 받아 둔다
const autoTried = new Set();   // 자동 번역을 한 번 시도한 문구 — 실패해도 되풀이하지 않는다

/* 영문 문구/부정어 → 한글 뜻. 용어집에 없으면 영문을 그대로 두고 물음표를 붙인다
   (새로 쓴 문구라는 표시다 — 조용히 감추면 번역이 있는지 없는지 알 수 없다). */
function glossOne(k, map) {
  const cast = k.match(/^\{cast:([a-z0-9-]+)\}$/);
  if (cast) return [`${(G.cast || {})[cast[1]] || cast[1]} — 인물 정본 어휘`, true];
  const cos = k.match(/^\{costume:([a-z0-9-]+)\}$/);
  if (cos) return [`${(G.cast || {})[cos[1]] || cos[1]}의 복식 표본`, true];
  if (k === '{head_neg}') return [(G.placeholder || {}).head_neg || k, true];
  return map[k] ? [map[k], true] : [k, false];
}
function glossHTML(parts, map) {
  if (!G) return '';
  const out = parts.map(p => p.trim()).filter(Boolean).map(k => {
    const [txt, known] = glossOne(k, map);
    return known ? esc(txt) : `<span class="unk">${esc(txt)} ?</span>`;
  });
  return out.length ? out.join(' <span class="sep">·</span> ') : '';
}
const glossPrompt = (t) => glossHTML(String(t).trim().replace(/\.$/, '').split(','), (G && G.frag) || {});
const glossNeg = (t) => glossHTML(String(t).split(','), (G && G.neg) || {});

async function api(path, opt) {
  const h = { 'Content-Type': 'application/json' };
  if (TK) h['X-Scene-Token'] = TK;
  const r = await fetch('/api' + path, { ...opt, headers: h });
  const t = await r.text();
  let j = null; try { j = JSON.parse(t); } catch (e) { /* 빈 응답 */ }
  if (!r.ok) throw new Error((j && j.error) || `${r.status} ${t.slice(0, 200)}`);
  return j;
}
function fail(e) {
  document.getElementById('app').prepend($(`<div class="card err">문제가 생겼다 — ${esc(e.message)}</div>`).firstChild);
}

/* ---------- 목록 ---------- */
async function list() {
  S.scene = S.stage = null;
  document.getElementById('head').textContent = '장면 승인';
  const rows = await api('/scenes');
  const app = document.getElementById('app');
  app.innerHTML = rows.length ? '' : '<div class="card">장면이 없다.</div>';
  for (const s of rows) {
    const el = $(`<div class="card"><div class="row" style="justify-content:space-between">
        <strong class="wrap">${esc(s.title)}</strong>
        ${s.done ? '<span class="badge ok">완료</span>' : ''}
      </div>
      <div class="mut">승인 ${s.approved}/${s.stages}${s.stale ? ` · 재검토 ${s.stale}` : ''}</div>
      <div class="row" style="margin-top:var(--s3)"><button data-id="${esc(s.id)}">열기</button></div>
    </div>`).firstChild;
    el.querySelector('button').onclick = () => open(s.id).catch(fail);
    app.append(el);
  }
}

/* ---------- 장면 ---------- */
async function open(id) {
  S.scene = await api('/scenes/' + id);
  if (!S.stage || !S.scene.stages.some(x => x.id === S.stage)) {
    S.stage = (S.scene.stages.find(x => x.status !== '건너뜀') || {}).id || null;
  }
  draw();
}
async function reload() { await open(S.scene.id); }

function ladderCard() {
  const d = S.scene, L = d.ladder;
  const names = { verses: '① 본문', description: '② 무엇을 그릴까', split: '③ 어떻게 나눌까' };
  const body = {
    verses: `${esc(d.verses?.range || '')}<ul>${Object.entries(d.verses?.quotes || {})
      .map(([k, v]) => `<li class="wrap"><b>${esc(k)}</b> ${esc(v)}</li>`).join('')}</ul>`,
    description: `<div class="wrap">${esc(d.moment?.why || '')}</div>
      <ul>${[...(d.background || []).map(b => b.what), ...(d.crowds || []).map(c => c.what),
             ...(d.figures || []).map(f => f.role)].map(x => `<li class="wrap">${esc(x)}</li>`).join('')}</ul>`,
    split: `<div class="wrap">${d.stages.filter(s => s.status !== '건너뜀')
      .map(s => `${esc(s.id)}(${esc(s.kind)}·${esc(s.region)})`).join(' → ')}</div>`,
  };
  return Object.keys(names).map(k => {
    const el = $(`<div class="card">
      <div class="row" style="justify-content:space-between">
        <h2>${names[k]}</h2>
        ${L[k].stale ? '<span class="badge">재검토</span>'
          : L[k].approved ? '<span class="badge ok">확인함</span>' : '<span class="mut">미확인</span>'}
      </div>
      ${body[k]}
      <div class="row" style="margin-top:var(--s3)"><button>확인</button></div>
    </div>`).firstChild;
    el.querySelector('button').onclick = () => act(() =>
      api(`/scenes/${S.scene.id}/approve`, { method: 'POST', body: JSON.stringify({ kind: 'ladder', ladder: k }) }));
    return el;
  });
}

function boardCard() {
  const el = $(`<div class="card"><h2>단계</h2><div class="row" id="chips"></div></div>`).firstChild;
  const box = el.querySelector('#chips');
  for (const s of S.scene.stages) {
    if (s.status === '건너뜀') continue;
    const c = $(`<button class="chip s-${s.status}" aria-pressed="${s.id === S.stage}">${esc(s.id)} · ${esc(s.status)}</button>`).firstChild;
    c.onclick = () => { S.stage = s.id; S.tokens = null; draw(); };
    box.append(c);
  }
  return el;
}

function triesCard(st) {
  const el = $(`<div class="card"><h2>${esc(st.id)} 시도</h2>
    ${st.why.length ? `<div class="badge">재검토</div><ul>${st.why.map(w => `<li class="wrap">${esc(w)}</li>`).join('')}</ul>` : ''}
    ${st.from ? `<div class="mut wrap">이 단계는 <code>from: ${esc(st.from)}</code>라 재개로 그릴 수 없다.</div>` : ''}
    <div id="tries"></div></div>`).firstChild;
  const box = el.querySelector('#tries');
  if (!st.tries.length) { box.innerHTML = '<div class="mut">아직 시도가 없다. 아래에서 한 장 걸어 보라.</div>'; return el; }
  for (const t of st.tries) {
    for (const [seed, im] of Object.entries(t.images)) {
      const cur = st.approved && st.approved.attempt === t.id && String(st.approved.seed) === seed;
      const row = $(`<div style="margin-top:var(--s3);padding-top:var(--s3);border-top:1px solid var(--line)">
        <a href="${img(im.canvas)}" target="_blank" rel="noopener">
          <img class="shot" loading="lazy" alt="${esc(t.id)} 시드 ${esc(seed)}" src="${img(im.canvas)}"></a>
        <div class="row" style="margin-top:var(--s2);justify-content:space-between">
          <span class="mut">${esc(t.id)} · 시드 ${esc(seed)}${t.tokens ? ` · ${t.tokens.n}/${t.tokens.lim}토큰` : ''}${t.seconds ? ` · ${Math.round(t.seconds)}s` : ''}</span>
          ${cur ? '<span class="badge ok">승인됨</span>' : ''}
        </div>
        <details><summary class="mut" style="min-height:var(--tap);display:flex;align-items:center">이때의 문구</summary>
          <div class="wrap mut">+ ${esc(t.prompt)}</div>
          <div class="ko">${glossPrompt(t.prompt || '')}</div>
          <div class="wrap mut">− ${esc((t.neg || []).join(', '))}</div>
          <div class="ko">${glossNeg((t.neg || []).join(', '))}</div></details>
        <div class="row" style="margin-top:var(--s2)">
          <button class="p" ${cur ? 'disabled' : ''}>이 장으로 승인</button>
          ${st.why.length && st.kind === 'plate' ? '<button data-again="1">같은 시드로 다시</button>' : ''}
        </div></div>`).firstChild;
      row.querySelector('button.p').onclick = () => act(() =>
        api(`/scenes/${S.scene.id}/approve`, { method: 'POST',
          body: JSON.stringify({ kind: 'stage', stage: st.id, attempt: t.id, seed: +seed }) }));
      const again = row.querySelector('[data-again]');
      if (again) again.onclick = () => act(() =>
        api(`/scenes/${S.scene.id}/attempts`, { method: 'POST',
          body: JSON.stringify({ stage: st.id, seeds: [+seed] }) }));
      box.append(row);
    }
  }
  return el;
}

/* 같은 구역 이름을 쓰는 다른 단계 — 좌표를 고치면 함께 움직인다. */
function shared(st) {
  const o = S.scene.stages.filter(x => x.id !== st.id && x.region === st.region && x.status !== '건너뜀');
  return o.length ? o.map(x => x.id).join('·') : null;
}

/* 이 단계가 **얹힐** 캔버스 — 직전 비건너뜀 단계의 승인본. 없으면 빈 종이(첫 단계)다. */
function backdropFor(st) {
  const live = S.scene.stages.filter(x => x.status !== '건너뜀');
  for (let j = live.findIndex(x => x.id === st.id) - 1; j >= 0; j--) {
    const ap = live[j].approved;
    if (!ap) continue;
    const t = live[j].tries.find(x => x.id === ap.attempt);
    const im = t && t.images[String(ap.seed)];
    if (im && im.canvas) return im.canvas;
  }
  return null;
}

/* 그림 위에서 사각형을 끌면 구역 좌표가 채워진다. 숫자 칸은 미세 조정용으로 남긴다. */
function regionPicker(st, inputs, onChange) {
  const bg = backdropFor(st);
  const ar = `${S.scene.canvas.w} / ${S.scene.canvas.h}`;
  const el = $(`<div class="pick" style="aspect-ratio:${ar}">
      ${bg ? `<img alt="이 단계가 얹힐 캔버스" src="${img(bg)}">` : '<div class="blank"></div>'}
      <div class="box" hidden></div>
      ${bg ? '' : '<div class="hint">앞 단계 승인본이 없다 — 빈 종이 기준으로 고른다</div>'}
    </div>`).firstChild;
  const box = el.querySelector('.box');
  const read = () => inputs.map(i => parseFloat(i.value));
  const paint = () => {
    const [x0, y0, x1, y1] = read();
    if (![x0, y0, x1, y1].every(Number.isFinite) || x1 <= x0 || y1 <= y0) { box.hidden = true; return; }
    box.hidden = false;
    box.style.left = `${x0 * 100}%`; box.style.top = `${y0 * 100}%`;
    box.style.width = `${(x1 - x0) * 100}%`; box.style.height = `${(y1 - y0) * 100}%`;
  };
  const at = (ev) => {
    const r = el.getBoundingClientRect();
    return [Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width)),
            Math.min(1, Math.max(0, (ev.clientY - r.top) / r.height))];
  };
  let start = null;
  el.addEventListener('pointerdown', (ev) => {
    start = at(ev); el.setPointerCapture(ev.pointerId); ev.preventDefault();
  });
  el.addEventListener('pointermove', (ev) => {
    if (!start) return;
    const [x, y] = at(ev);
    const v = [Math.min(start[0], x), Math.min(start[1], y), Math.max(start[0], x), Math.max(start[1], y)];
    v.forEach((n, i) => inputs[i].value = n.toFixed(3));
    paint();
  });
  const end = (ev) => {
    if (!start) return;
    const [x, y] = at(ev);
    // 살짝 누른 것은 상자를 그리려던 게 아니다 — 원래 값으로 되돌린다(실수로 구역이 사라지지 않게).
    if (Math.abs(x - start[0]) < 0.02 || Math.abs(y - start[1]) < 0.02) {
      st.coords.forEach((c, i) => inputs[i].value = c);
      paint();
    }
    start = null;
    onChange();
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  inputs.forEach(i => i.addEventListener('input', paint));
  paint();
  return el;
}

function formCard(st) {
  const el = $(`<div class="card"><h2>다시 그리기</h2>
    <label for="sd">시드 (쉼표)</label><input id="sd" value="${esc(S.scene.sceneSeed || 11)}" inputmode="numeric">
    <label for="ask">AI에게 시키기 — <b>한국어로</b> 말하면 영문 문구를 지어 준다</label>
    <textarea id="ask" class="wrap" placeholder="예) 사무엘이 기름 뿔을 들어 올리게 · 배경을 새벽빛으로 · 사람 빼고 제단만"></textarea>
    <div class="row" style="margin-top:var(--s2)"><button id="gen">문구 만들기</button></div>
    <div class="ko" id="why"></div>
    <label for="pr">문구 — 이 단계에 <b>그릴 것</b></label>
    <textarea id="pr" class="wrap">${esc(st.prompt)}</textarea>
    <div class="ko" id="ko-pr"></div>
    <label for="ng">부정어 (쉼표) — 이 단계에 <b>그리지 말 것</b></label>
    <textarea id="ng" class="wrap">${esc((st.neg || []).join(', '))}</textarea>
    <div class="ko" id="ko-ng"></div>
    <div class="row" style="margin-top:var(--s2)">
      <button id="fill" hidden>모르는 낱말 번역</button></div>
    <label>구역 — 그림 위에서 <b>사각형을 끌어</b> 고른다 <span class="mut">(${esc(st.region)})</span></label>
    <div id="pickslot"></div>
    <div class="mut" style="margin-top:var(--s1)">칠할 자리를 손가락이나 마우스로 끈다. 살짝 누르면 없던 일이 된다.
      ${shared(st) ? `<b>이 구역 이름을 ${esc(shared(st))}도 같이 쓴다 — 고치면 함께 움직인다.</b>` : ''}</div>
    <label>미세 조정 — x0 · y0 · x1 · y1 (0~1)</label>
    <div class="grid4">${st.coords.map((c, i) => `<input data-c="${i}" value="${c}" inputmode="decimal">`).join('')}</div>
    <div id="tk" class="mut" style="margin-top:var(--s2)"></div>
    <div class="row" style="margin-top:var(--s3)">
      <button id="save">명세에 저장</button>
      <button id="one" class="p" ${st.from ? 'disabled' : ''}>1장 그리기</button>
      <button id="three" ${st.from ? 'disabled' : ''}>3장 그리기</button>
    </div>
    <div class="mut" style="margin-top:var(--s2)">
      <b>명세에 저장</b>은 위 셋을 장면 명세에 적기만 한다(그리지 않는다).
      <b>그리기</b>는 먼저 저장한 뒤 GPU에 한 장 건다 — <b>3장</b>은 시드를 여러 개 써서 고를 수 있게 한다.
      시드가 하나면 3장은 11·42·7을 쓴다.
    </div></div>`).firstChild;
  const ko = () => {
    const kp = el.querySelector('#ko-pr'), kn = el.querySelector('#ko-ng');
    if (kp) kp.innerHTML = glossPrompt(el.querySelector('#pr').value);
    if (kn) kn.innerHTML = glossNeg(el.querySelector('#ng').value);
    const fill = el.querySelector('#fill');
    if (fill) fill.hidden = !el.querySelectorAll('.ko .unk').length;   // 모르는 것이 있을 때만 보인다
  };
  ko();
  el.querySelector('#pr').addEventListener('input', ko);
  el.querySelector('#ng').addEventListener('input', ko);
  /* AI 생성은 `act()`를 지나지 않는다 — act는 끝나면 화면을 다시 그려서 방금 받은 문구가 날아간다. */
  const gen = el.querySelector('#gen'), why = el.querySelector('#why');
  gen.onclick = async () => {
    if (gen.disabled) return;
    gen.disabled = true; gen.textContent = '만드는 중…';
    why.innerHTML = '';
    try {
      // 요청을 붙잡고 기다리지 않는다 — AI가 20~60초라 폰이 먼저 끊는다(`Failed to fetch`).
      // 번호만 받고 결과를 물어본다.
      const { job } = await api(`/scenes/${S.scene.id}/stages/${st.id}/compose`, {
        method: 'POST', body: JSON.stringify({ ask: el.querySelector('#ask').value }) });
      const r = await waitJob(job, (sec) => { gen.textContent = `만드는 중… ${sec}초`; });
      el.querySelector('#pr').value = r.prompt;
      el.querySelector('#ng').value = (r.neg || []).join(', ');
      // 지어낸 표현의 뜻이 함께 왔다 — 용어집에 바로 얹어 물음표가 남지 않게 한다.
      addGloss(r.gloss);
      ko();
      const t = r.tokens || {};
      why.innerHTML = `${esc(r.why || '')}`
        + (t.ok === false ? ` <span class="unk">토큰 ${t.n}/${t.lim} — 넘친다, 줄여야 한다</span>`
           : t.ok ? ` <span class="sep">·</span> 토큰 ${t.n}/${t.lim}` : '');
    } catch (e) { fail(e); }
    gen.disabled = false; gen.textContent = '문구 만들기';
  };
  const fill = el.querySelector('#fill');
  const runFill = async (silent) => {
    if (fill.disabled) return;
    fill.hidden = false;                       // 자동으로 돌 때도 무엇이 도는지 보이게
    fill.disabled = true; fill.textContent = '번역 중…';
    try {
      const { job } = await api('/gloss', { method: 'POST', body: JSON.stringify({
        prompt: el.querySelector('#pr').value,
        neg: el.querySelector('#ng').value.split(',').map(x => x.trim()).filter(Boolean) }) });
      const r = await waitJob(job, (sec) => { fill.textContent = `번역 중… ${sec}초`; });
      addGloss(r.gloss);
      // 번역이 도는 20~40초 사이에 사람이 다른 단계로 갔을 수 있다. 그러면 이 폼은 이미 화면에서
      // 떨어져 나가 `ko()`가 아무 데도 안 닿는다 — 지금 떠 있는 화면을 다시 그려 뜻을 얹는다.
      if (el.isConnected) ko(); else if (S.scene) { draw(); return; }
    } catch (e) { if (!silent) fail(e); }      // 자동 시도의 실패는 조용히 — 버튼이 남아 다시 누를 수 있다
    if (!el.isConnected) return;
    fill.disabled = false; fill.textContent = '모르는 낱말 번역';
    ko();
  };
  fill.onclick = () => runFill(false);
  const coordInputs = [...el.querySelectorAll('[data-c]')];
  el.querySelector('#pickslot').append(regionPicker(st, coordInputs, () => {}));

  /* 저장된 문구에 모르는 조각이 있으면 **사람이 누르기 전에** 번역한다.
     버튼을 눌러야 한글이 붙는 것은 도구가 할 일을 사람에게 미루는 것이다.
     같은 문구로는 한 번만 시도한다(실패해도 되풀이하지 않게). */
  const sig = `${S.scene.id}|${st.id}|${st.prompt}|${(st.neg || []).join(',')}`;
  if (!autoTried.has(sig) && el.querySelectorAll('.ko .unk').length) {
    autoTried.add(sig);
    runFill(true);
  }
  const tk = el.querySelector('#tk');
  if (S.tokens) tk.innerHTML = S.tokens.ok === false
    ? `<span class="badge">토큰 넘침</span> <span class="wrap">${esc(S.tokens.over.join(' / ') || S.tokens.tail)}</span>`
    : S.tokens.ok ? '<span class="badge ok">토큰 한도 안</span>' : `<span class="wrap">${esc(S.tokens.tail)}</span>`;
  const seeds = () => el.querySelector('#sd').value.split(',').map(x => parseInt(x, 10)).filter(Number.isFinite);
  const seed1 = () => { const v = seeds(); return v.length ? v[0] : (S.scene.sceneSeed || 11); };
  el.querySelector('#save').onclick = () => act(async () => {
    const r = await api(`/scenes/${S.scene.id}/stages/${st.id}`, { method: 'PATCH', body: JSON.stringify({
      prompt: el.querySelector('#pr').value,
      neg: el.querySelector('#ng').value.split(',').map(s => s.trim()).filter(Boolean),
      region: [...el.querySelectorAll('[data-c]')].map(i => parseFloat(i.value)),
    })});
    // 토큰 검사는 토크나이저 로드가 십수 초다 — 저장을 붙잡지 않고 따로 받아 폼 옆에 채운다.
    api(`/scenes/${S.scene.id}/tokens`).then(t => { S.tokens = t; const b = document.getElementById('tk');
      if (b) b.innerHTML = t.ok === false
        ? `<span class="badge">토큰 넘침</span> <span class="wrap">${esc(t.over.join(' / ') || t.tail)}</span>`
        : t.ok ? '<span class="badge ok">토큰 한도 안</span>' : `<span class="wrap">${esc(t.tail)}</span>`;
    }).catch(() => {});
    return r;
  });
  /* 그리기 전에 반드시 저장한다. 생성기는 **명세 파일**을 읽으므로, 폼만 고치고 그리면
     화면에 보이는 문구가 아니라 옛 문구로 그려진다. */
  const go = (n) => act(async () => {
    document.getElementById('q').innerHTML = '<div>줄에 넣는 중…</div>';
    await api(`/scenes/${S.scene.id}/stages/${st.id}`, { method: 'PATCH', body: JSON.stringify({
      prompt: el.querySelector('#pr').value,
      neg: el.querySelector('#ng').value.split(',').map(s => s.trim()).filter(Boolean),
      region: [...el.querySelectorAll('[data-c]')].map(i => parseFloat(i.value)),
    })});
    return api(`/scenes/${S.scene.id}/attempts`, { method: 'POST',
      body: JSON.stringify({ stage: st.id, seeds: n === 1 ? [seed1()]
                                                          : (seeds().length > 1 ? seeds() : [11, 42, 7]) }) });
  });
  el.querySelector('#one').onclick = () => go(1);
  el.querySelector('#three').onclick = () => go(3);
  return el;
}

function finalCard() {
  const live = S.scene.stages.filter(s => s.status !== '건너뜀');
  const last = live[live.length - 1];
  const f = S.scene.final;
  const shot = last && last.approved && (last.tries.find(t => t.id === last.approved.attempt) || {}).images;
  const src = shot && shot[String(last.approved.seed)] && shot[String(last.approved.seed)].canvas;
  const el = $(`<div class="card"><div class="row" style="justify-content:space-between"><h2>장면 완료</h2>
      ${f.stale ? '<span class="badge">재검토</span>' : f.approved ? '<span class="badge ok">완료</span>' : ''}</div>
    ${src ? `<a href="${img(src)}" target="_blank" rel="noopener"><img class="shot" alt="마지막 단계 승인본" src="${img(src)}"></a>` : '<div class="mut">마지막 단계가 아직 승인되지 않았다.</div>'}
    ${f.why.length ? `<ul>${f.why.map(w => `<li class="wrap">${esc(w)}</li>`).join('')}</ul>` : ''}
    <div class="row" style="margin-top:var(--s3)"><button class="p" ${last && last.approved ? '' : 'disabled'}>장면 완료</button></div></div>`).firstChild;
  el.querySelector('button').onclick = () => {
    if (!last || !last.approved) return;    // 마지막 단계가 미승인이면 가리킬 시도가 없다
    act(() => api(`/scenes/${S.scene.id}/approve`, { method: 'POST',
      body: JSON.stringify({ kind: 'final', attempt: last.approved.attempt, seed: last.approved.seed }) }));
  };
  return el;
}

function draw() {
  const app = document.getElementById('app');
  document.getElementById('head').textContent = S.scene.title;
  app.innerHTML = '';
  const back = $('<div class="row" style="margin-bottom:var(--s3)"><button>← 목록</button></div>').firstChild;
  back.querySelector('button').onclick = () => list().catch(fail);
  app.append(back, ...ladderCard(), boardCard());
  const st = S.scene.stages.find(x => x.id === S.stage);
  if (st) app.append(triesCard(st), formCard(st));
  app.append(finalCard());
}

/* 새로 받은 뜻을 얹되 **이미 있는 것은 덮지 않는다** — 서버의 축적 규칙과 같게 해야
   화면에 보이는 한글과 용어집에 저장된 한글이 어긋나지 않는다. */
function addGloss(gloss) {
  if (!G || !gloss) return;
  for (const [k, v] of Object.entries(gloss)) {
    if (!(k in G.frag)) G.frag[k] = v;
    if (!(k in G.neg)) G.neg[k] = v;
  }
}

/* 번호를 받아 결과가 나올 때까지 물어본다. 문구 짓기와 낱말 번역이 함께 쓴다. */
async function waitJob(job, tick) {
  for (let i = 0; i < 200; i++) {                     // 최대 5분
    await new Promise(s => setTimeout(s, 1500));
    const got = await api(`/compose/${job}`);
    if (got.status === 'failed') throw new Error(got.error || 'AI가 실패했다');
    if (got.status === 'done') return got;
    if (tick) tick(Math.round(i * 1.5) + 2);
  }
  throw new Error('AI가 5분 안에 답하지 않았다');
}

/* 모든 쓰기는 이 하나를 지난다 — 중복 탭을 막고, 끝나면 다시 읽는다. */
async function act(fn) {
  if (S.busy) return;
  S.busy = true;
  document.querySelectorAll('.card.err').forEach(e => e.remove());   // 묵은 오류가 쌓이지 않게
  const btns = [...document.querySelectorAll('button')];
  const was = btns.map(b => b.disabled);
  btns.forEach(b => b.disabled = true);
  try { await fn(); await reload(); poll(); }
  // 실패하면 **원래 상태 그대로** 되돌린다. 전부 켜면 「장면 완료」처럼 일부러 꺼 둔 버튼까지
  // 눌려서 두 번째 오류가 난다(폰 실측 2026-09-05).
  catch (e) { fail(e); btns.forEach((b, i) => b.disabled = was[i]); }
  finally { S.busy = false; }
}

/* ---------- 큐 띠 (3초 폴링) ---------- */
const WORD = { done: '끝남', failed: '실패', cancelled: '멈춤' };

function drawQueue(q) {
  const r = q.running, box = document.getElementById('q');
  box.innerHTML = '';
  if (r) {
    const line = $(`<div class="row" style="justify-content:space-between">
      <span><b>그리는 중</b> ${esc(r.scene.replace('authored-', ''))} · ${esc(r.stage)}
        · 시드 ${esc(r.seeds.join(','))}</span>
      <button data-stop="${esc(r.id)}">멈추기</button></div>`).firstChild;
    line.querySelector('button').onclick = (ev) => cancelJob(ev.currentTarget, { job: r.id });
    box.append(line);
  }
  if (q.pending.length) {
    const line = $(`<div class="row" style="justify-content:space-between;margin-top:var(--s1)">
      <span>대기 ${q.pending.length}줄 — 앞의 것이 끝나면 하나씩 돈다</span>
      <button>대기 비우기</button></div>`).firstChild;
    line.querySelector('button').onclick = (ev) =>
      cancelJob(ev.currentTarget, { jobs: q.pending.map(j => j.id) });
    box.append(line);
  }
  if (!r && !q.pending.length) {
    const last = q.recent[0];
    box.append($(last
      ? `<div>${WORD[last.status] || last.status} ${esc(last.stage)}${
          last.status === 'done' ? '' : `<pre>${esc((last.log || '').slice(-400))}</pre>`}</div>`
      : '<div>큐 비어 있음</div>').firstChild);
  }
}

/* 대기 비우기는 작업마다 한 번씩 부른다 — 서버는 한 건씩 받는다. */
async function cancelJob(btn, what) {
  btn.disabled = true;
  btn.textContent = '멈추는 중…';
  try {
    for (const id of (what.jobs || [what.job])) await api('/queue/cancel', {
      method: 'POST', body: JSON.stringify({ job: id }) });
  } catch (e) { fail(e); }
  await poll();
}

async function poll() {
  try {
    const q = await api('/queue');
    drawQueue(q);
    if (!q.running && S.scene && !S.busy && window.__wasRunning) {
      window.__wasRunning = false;
      reload().catch(() => {});
    }
    if (q.running) window.__wasRunning = true;
  } catch (e) { /* 폴링 실패는 조용히 넘긴다 */ }
}
setInterval(poll, 3000);
poll();
api('/glossary').then(g => { G = g; if (S.scene) draw(); }).catch(() => { G = { frag: {}, neg: {} }; });
list().catch(fail);
</script>
