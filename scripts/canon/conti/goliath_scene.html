  배경은 능선과 지면만.
  지물 = 물매(다윗) · 대검 · 큰 창 · 단창(골리앗). 방패는 없다(17:7 「방패 든 자」).
  뺀 것: 서사 기호 전부(머리 위 원 · 궤적 호 · 화살표 · 충격 표시) · 이목구비 전부(머리는 윤곽만) ·

  == rev.2에서 바뀐 것 (사용자 UAT 반려 + 성경 본문 확인) ==
  1. **방패를 뺐다.** 삼상 17:7 「방패 든 자는 앞서 행하더라」 — 방패는 별도의 방패 든 자가 들었고
     골리앗이 직접 든 것이 아니다. 1차 콘티는 앱 장면 스케치(davidUnitedKingdom.jsx:187 「방패」)를
     참조하다 이 오류를 그대로 옮겼다.
  2. **대검을 넣었다.** 삼상 17:45 「칼과 창과 단창」 · 17:51 다윗이 그 칼로 골리앗의 목을 벴다.
  3. **물매 끈을 길게 뺐다.** 1차 콘티는 끈 53px으로 「깃대」로 오독됐다 — 끈 두 가닥을 160px로
     늘리고 끝에 돌주머니(요람 호) + 돌을 달아 형태만으로 물매로 읽히게 했다.
  4. **다윗을 축소해 거인 비를 만들었다.** 1차 1.27배 → rev.2 약 1.74배. 근거는 삼상 17:4
     「신장 여섯 규빗 한 뼘」(약 297cm)이 당대 성인 남자(약 165cm)의 약 1.8배라는 것이다.
     캔버스가 640px이라 골리앗을 키울 수 없어 다윗을 지면(y=560)·중심(x=340) 기준 0.73배로 줄였다.
     다윗의 좌표는 손으로 옮기지 않고 그 스케일로 파생했다.
