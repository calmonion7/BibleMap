<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>얼굴 유지 A/B 판정</title><style>
:root{--bg:#fff;--fg:#1c1c1c;--mu:#555;--bd:#ddd;--ac:#1d4ed8}
@media(prefers-color-scheme:dark){:root{--bg:#161616;--fg:#eee;--mu:#aaa;--bd:#333;--ac:#7aa2ff}}
*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif;max-width:720px;margin-inline:auto}
h1{font-size:20px;margin:0 0 8px}h2{font-size:20px;margin:32px 0 8px}h3{font-size:16px;margin:16px 0 8px}
p,.mu{color:var(--mu);margin:4px 0 8px}img{max-width:100%;height:auto;display:block;border:1px solid var(--bd)}
figure{margin:0 0 16px}figcaption{font-size:14px;color:var(--mu);padding-top:4px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}fieldset{border:1px solid var(--bd);margin:16px 0;padding:8px 16px}
legend{font-weight:700;padding:0 8px}label{display:flex;gap:8px;align-items:center;min-height:44px}
input{width:24px;height:24px;accent-color:var(--ac)}</style></head><body>
<h1>얼굴 유지 A/B 판정 (task 346)</h1>
<p>A = LoRA 인페인트, B = klein 참조. e = 승인 그림에서 얼굴만 교체, f = 같은 프롬프트로 새로 생성. 맨 아래에서 A/B 각각 6기준을 체크하세요.</p>
<h2>새 정본</h2><div class="row"><figure><a href="../../frozen/saul.png"><img src="../../frozen/saul.png" alt="사울"></a><figcaption>사울</figcaption></figure><figure><a href="../../frozen/david.png"><img src="../../frozen/david.png" alt="다윗"></a><figcaption>다윗</figcaption></figure></div>

<a href="B-f-engedi-s42.png"><img loading="lazy" src="B-f-engedi-s42.png" alt="B-f"></a><figcaption>B-f 새로 생성</figcaption></figure></div><h3>시드 23</h3><div class="row"><figure><a href="A-e-engedi-s23.png"><img loading="lazy" src="A-e-engedi-s23.png" alt="A-e"></a><figcaption>A-e 승인 출발</figcaption></figure><figure><a href="B-e-engedi-s23.png"><img loading="lazy" src="B-e-engedi-s23.png" alt="B-e"></a><figcaption>B-e 승인 출발</figcaption></figure></div><div class="row"><figure><a href="A-f-engedi-s23.png"><img loading="lazy" src="A-f-engedi-s23.png" alt="A-f"></a><figcaption>A-f 새로 생성</figcaption></figure><figure><a href="B-f-engedi-s23.png"><img loading="lazy" src="B-f-engedi-s23.png" alt="B-f"></a><figcaption>B-f 새로 생성</figcaption></figure></div><h2>6기준 판정</h2><fieldset><legend>A (LoRA 인페인트)</legend><label><input type="checkbox" data-k="A0">① 장면 간 같은 얼굴</label><label><input type="checkbox" data-k="A1">② 새 정본과 닮음</label><label><input type="checkbox" data-k="A2">③ 연필 화풍 유지</label><label><input type="checkbox" data-k="A3">④ 장면 뜻 유지</label><label><input type="checkbox" data-k="A4">⑤ 인물끼리 구별</label><label><input type="checkbox" data-k="A5">⑥ 한 장 안에서 섞이지 않음</label></fieldset><fieldset><legend>B (klein 참조)</legend><label><input type="checkbox" data-k="B0">① 장면 간 같은 얼굴</label><label><input type="checkbox" data-k="B1">② 새 정본과 닮음</label><label><input type="checkbox" data-k="B2">③ 연필 화풍 유지</label><label><input type="checkbox" data-k="B3">④ 장면 뜻 유지</label><label><input type="checkbox" data-k="B4">⑤ 인물끼리 구별</label><label><input type="checkbox" data-k="B5">⑥ 한 장 안에서 섞이지 않음</label></fieldset><script>
document.querySelectorAll('input[data-k]').forEach(function(e){var k='face-ab:'+e.dataset.k;
try{e.checked=localStorage.getItem(k)==='1'}catch(x){}
e.onchange=function(){try{localStorage.setItem(k,e.checked?'1':'0')}catch(x){}}});
</script></body></html>
